<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - RBWR SC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-gray-800 text-white p-4 flex items-center justify-between">
        <a href="/" class="font-bold text-lg">RBWR SERVER CHECKER</a>
        <div class="flex gap-4 text-sm">
            <a href="https://rbwr.hotment.dev/" target="_blank" rel="noopener" class="hover:text-blue-300">APRM Calc</a>

    <main class="flex-1 bg-gray-900 text-white flex items-center justify-center">
        {% block content %}{% endblock %}

    <footer class="bg-gray-800 text-white p-2 text-center">
        <p>{{ now.year }} © RBWR Server Checker. All rights reserved.</p>
        <a href="https://ko-fi.com/felixqx1" target="_blank" rel="noopener" class="font-bold hover:text-orange-400 text-orange-300">My Ko-Fi</a>
