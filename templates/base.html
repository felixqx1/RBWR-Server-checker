<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - RBWR SC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-gray-800 text-white p-4 flex items-center justify-between">
        <a href="/" class="font-bold text-lg">RBWR SERVER CHECKER</a>
        <div class="flex gap-4 text-sm">
            <a href="https://rbwr.hotment.dev/" target="_blank" rel="noopener" class="hover:text-blue-300">APRM Calc</a>
            <a href="https://rbwr.hotment.dev/suggestions" target="_blank" rel="noopener" class="hover:text-blue-300">Suggestions</a>
            <a href="/servers" class="hover:text-blue-300">Servers</a>
        </div>
    </nav>

    <main class="flex-1 bg-gray-900 text-white flex items-center justify-center">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white p-3 text-center">
        <p class="mb-2 text-sm text-gray-300">{{ now.year }} © RBWR Server Checker. All rights reserved.</p>
        <a
            href="https://ko-fi.com/felixqx1"
            target="_blank"
            rel="noopener"
            class="inline-flex items-center justify-center rounded-full bg-[#ff5f5f] px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-red-500/20 transition duration-200 hover:-translate-y-0.5 hover:bg-[#ff4b4b] focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 focus:ring-offset-gray-800"
        >
            ☕ Support on Ko-fi
        </a>
    </footer>
</body>
</html>
