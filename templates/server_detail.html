{% extends 'base.html' %}
{% block title %}{{ job_id }}{% endblock %}

{% block content %}
<div class="mx-auto w-full px-6 py-10">
    <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
        <div>
            <p class="text-sm uppercase tracking-[0.3em] text-blue-300">analytics</p>
            <h2 class="text-3xl font-semibold">{{ job_id }}</h2>
        </div>
        <a href="/servers" class="rounded-lg border border-gray-700 px-4 py-2 text-sm text-gray-300 hover:border-blue-400 hover:text-white">Back to servers</a>
    </div>

    <div class="grid grid-cols-2 gap-6 md:grid-cols-2">
        {% for chart in charts %}
        <div class="rounded-2xl border border-gray-700 bg-gray-800/80 p-6 shadow-lg">
            <h3 class="mb-4 text-xl font-semibold">{{ chart.metric }}</h3>
            <div class="h-[70vh] min-h-[480px] w-full">
                <canvas id="chart-{{ loop.index0 }}" class="h-full w-full"></canvas>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
    const charts = {{ charts|tojson }};
    charts.forEach((chart, index) => {
        const ctx = document.getElementById(`chart-${index}`);
        if (!ctx) return;
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: chart.labels,
                datasets: chart.datasets.map(dataset => ({
                    ...dataset,
                    fill: false,
                    tension: 0.25,
                    pointRadius: 2,
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: 'white' } }
                },
                scales: {
                    x: { ticks: { color: 'white' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                    y: { ticks: { color: 'white' }, grid: { color: 'rgba(255,255,255,0.08)' } }
                }
            }
        });
    });
</script>
{% endblock %}
